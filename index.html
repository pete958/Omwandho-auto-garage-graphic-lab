<script>

/* =====================================================
   OMWANDHO AI — CLOUDFLARE CHAT CONNECTION
   ===================================================== */

const AI_WORKER_URL =
"https://omwandhoai.omwandhopeter89.workers.dev/chat";


/* =====================================================
   MOBILE MENU
   ===================================================== */

function toggleMenu(){

    document
    .getElementById("navLinks")
    .classList
    .toggle("active");

}


document
.querySelectorAll(".nav-links a")
.forEach(function(link){

    link.addEventListener("click",function(){

        document
        .getElementById("navLinks")
        .classList
        .remove("active");

    });

});


/* =====================================================
   YEAR
   ===================================================== */

document
.getElementById("year")
.textContent =
new Date().getFullYear();


/* =====================================================
   AI OPEN / CLOSE
   ===================================================== */

function openAI(){

    document
    .getElementById("aiPanel")
    .classList
    .add("open");

    document
    .getElementById("aiLabel")
    .style
    .display="none";

    setTimeout(function(){

        document
        .getElementById("aiInput")
        .focus();

    },200);

}


function closeAI(){

    document
    .getElementById("aiPanel")
    .classList
    .remove("open");

    document
    .getElementById("aiLabel")
    .style
    .display="block";

}


function toggleAI(){

    const panel =
    document.getElementById("aiPanel");

    if(panel.classList.contains("open")){

        closeAI();

    }else{

        openAI();

    }

}


/* =====================================================
   QUICK QUESTIONS
   ===================================================== */

function quickAsk(text){

    document
    .getElementById("aiInput")
    .value=text;

    sendAIMessage();

}


/* =====================================================
   ENTER KEY
   ===================================================== */

function handleAIKey(event){

    if(event.key==="Enter" && !event.shiftKey){

        event.preventDefault();

        sendAIMessage();

    }

}


/* =====================================================
   ADD MESSAGE
   ===================================================== */

function addAIMessage(text,type){

    const container =
    document.getElementById("aiMessages");

    const message =
    document.createElement("div");

    message.className =
    "ai-message " + type;

    message.textContent =
    text;

    container.appendChild(message);

    container.scrollTop =
    container.scrollHeight;

}


/* =====================================================
   TYPING INDICATOR
   ===================================================== */

function showTyping(){

    const container =
    document.getElementById("aiMessages");

    const typing =
    document.createElement("div");

    typing.id="aiTyping";

    typing.className="ai-typing";

    typing.textContent =
    "OMWANDHO AI is typing...";

    container.appendChild(typing);

    container.scrollTop =
    container.scrollHeight;

}


function removeTyping(){

    const typing =
    document.getElementById("aiTyping");

    if(typing){

        typing.remove();

    }

}


/* =====================================================
   SEND MESSAGE TO CLOUDFLARE /chat
   ===================================================== */

async function sendAIMessage(){

    const input =
    document.getElementById("aiInput");

    const sendButton =
    document.getElementById("aiSend");

    const message =
    input.value.trim();


    if(!message){

        return;

    }


    /* Show customer's message */

    addAIMessage(
        message,
        "user"
    );


    input.value="";

    sendButton.disabled=true;

    showTyping();


    try{

        const response =
        await fetch(
            AI_WORKER_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",
                    "Accept":
                    "application/json"
                },

                body:
                JSON.stringify({
                    message:message
                })
            }
        );


        /* Check HTTP response */

        if(!response.ok){

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
        await response.json();


        removeTyping();


        /* =================================================
           ACCEPT NORMAL AI RESPONSE
           ================================================= */

        if(
            data &&
            data.success &&
            data.reply
        ){

            addAIMessage(
                data.reply,
                "bot"
            );

        }

        /* =================================================
           HANDLE RESPONSE IF REPLY EXISTS WITHOUT SUCCESS
           ================================================= */

        else if(
            data &&
            data.reply
        ){

            addAIMessage(
                data.reply,
                "bot"
            );

        }

        /* =================================================
           HANDLE ERROR FROM SERVER
           ================================================= */

        else if(
            data &&
            data.error
        ){

            addAIMessage(
                "Sorry, OMWANDHO AI could not process that request right now. Please try again.",
                "bot"
            );

            console.error(
                "OMWANDHO AI server error:",
                data.error
            );

        }

        else{

            addAIMessage(
                "Sorry, I couldn't respond right now. Please try again or continue with us on WhatsApp.",
                "bot"
            );

            console.error(
                "Unexpected AI response:",
                data
            );

        }


    }catch(error){

        console.error(
            "OMWANDHO AI connection error:",
            error
        );


        removeTyping();


        addAIMessage(
            "I'm having trouble connecting right now. Please try again in a moment or continue with us on WhatsApp.",
            "bot"
        );

    }


    sendButton.disabled=false;

    input.focus();

}


/* =====================================================
   DO NOT AUTO-OPEN AI
   ===================================================== */

</script>
